<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newsletter - HitchedUp4Life</title>
  <meta name="description" content="Join the HitchedUp4Life newsletter for road updates, roadschooling notes, gear, food, and real family travel stories." />
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<div class="wrapper">
  <header class="container">
    <h1 class="site-title">Join the Fam</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Photos & Videos</a>
      <a href="gear.html">Shop</a>
      <a href="newsletter.html">Newsletter</a>
    </nav>
  </header>

  <main class="container newsletter-page">
    <section class="newsletter-intro center">
      <span class="badge">Newsletter</span>
      <h2>Ride with us from wherever you are.</h2>
      <p>Stories from the road, roadschooling, good food, gear, and the real-life chaos in between.</p>
    </section>

    <form
      class="signup-form"
      action="https://assets.mailerlite.com/jsonp/2158125/forms/181225854106339129/subscribe"
      method="post"
      target="_blank"
    >
      <label for="newsletter-email">Email address</label>
      <input id="newsletter-email" type="email" name="fields[email]" placeholder="Your email" autocomplete="email" required>

      <label class="check-row">
        <input type="checkbox" required>
        <span>I want the good stuff from the road.</span>
      </label>

      <div class="recaptcha-wrap">
        <div class="g-recaptcha" data-sitekey="6Lf1KHQUAAAAAFNKEX1hdSWCS3mRMv4FlFaNslaD"></div>
      </div>

      <input type="hidden" name="ml-submit" value="1">
      <input type="hidden" name="anticsrf" value="true">
      <button class="btn primary-btn signup-button" type="submit">Ride With Us</button>
    </form>
  </main>

  <footer>&copy; 2026 HitchedUp4Life. All rights reserved.</footer>
</div>
</body>
</html>
